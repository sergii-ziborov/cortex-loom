name: publish public crates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify workspace
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          npm --prefix ui ci
          npm --prefix ui run build
      - name: Publish independent crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p cortex-domain
          cargo publish --locked -p cortex-context
      - name: Wait for domain in crates.io index
        run: |
          for attempt in $(seq 1 30); do
            if cargo info cortex-domain@0.1.0 --registry crates-io >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo 'cortex-domain 0.1.0 did not reach the crates.io index' >&2
          exit 1
      - name: Publish dependent crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p cortex-router
          cargo publish --locked -p cortex-skills
