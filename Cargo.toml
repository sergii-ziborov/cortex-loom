[workspace]
members = [
  "apps/cortex-server",
  "crates/cortex-domain",
  "crates/cortex-context",
  "crates/cortex-eval",
  "crates/cortex-mcp",
  "crates/cortex-ollama",
  "crates/cortex-run",
  "crates/cortex-router",
  "crates/cortex-skills",
  "crates/cortex-store",
  "crates/cortex-weavatrix",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
repository = "https://github.com/sergii-ziborov/cortex-loom"

[workspace.dependencies]
axum = "0.8.9"
mcport = "0.3.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { package = "blazingly-json", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
ureq = { version = "3.3.0", default-features = false }
weavatrix-rust = "2.0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
