[workspace]
members = [
  "apps/cortex-server",
  "crates/cortex-adapters",
  "crates/cortex-bench",
  "crates/cortex-domain",
  "crates/cortex-context",
  "crates/cortex-eval",
  "crates/cortex-llm",
  "crates/cortex-mcp",
  "crates/cortex-ollama",
  "crates/cortex-run",
  "crates/cortex-router",
  "crates/cortex-sequences",
  "crates/cortex-shadow",
  "crates/cortex-skills",
  "crates/cortex-store",
  "crates/cortex-weavatrix",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
repository = "https://github.com/sergii-ziborov/cortex-loom"

[workspace.dependencies]
axum = "0.8.9"
include_dir = "0.7.4"
mcport = "0.5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
# The JSON engine is `blazingly-json`. Private crates take it under the
# `serde_json` alias for drop-in ergonomics; crates intended for public
# release depend on it by its real name so their manifests and rustdoc
# never misrepresent what a consumer is actually taking on.
blazingly-json = "0.1.5"
serde_json = { package = "blazingly-json", version = "0.1.5" }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
ureq = { version = "3.4.0", default-features = false }
weavatrix-edit = "0.1.7"
weavatrix-refactor-plan = "0.1.1"
weavatrix-rust = "2.5.1"

[profile.release]
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
