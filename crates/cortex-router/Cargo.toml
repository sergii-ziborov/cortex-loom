[package]
name = "cortex-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# The repository field is intentionally absent: the workspace URL points at a
# private repository and would 404 for every crates.io visitor. Add it back
# once a public repository exists.
license = "MIT OR Apache-2.0"
description = "Fail-closed, model-free routing policy that decides between deterministic tools, local models, and an upstream agent."
documentation = "https://docs.rs/cortex-router"
readme = "README.md"
keywords = ["llm", "routing", "policy", "classification", "agents"]
categories = ["algorithms", "development-tools"]
publish = true

[dependencies]
# `path` builds inside this workspace; `version` is what cargo publishes.
cortex-domain = { path = "../cortex-domain", version = "0.1.0" }
serde.workspace = true
unicode-normalization = "0.1.24"

[lints]
workspace = true
