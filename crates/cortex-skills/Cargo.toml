[package]
name = "cortex-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# The repository field is intentionally absent: the workspace URL points at a
# private repository and would 404 for every crates.io visitor. Add it back
# once a public repository exists.
license = "MIT OR Apache-2.0"
description = "Round-trip compiler between readable SKILL.md Markdown workflows and typed process graphs."
documentation = "https://docs.rs/cortex-skills"
readme = "README.md"
keywords = ["markdown", "workflow", "skills", "compiler", "graph"]
categories = ["parser-implementations", "development-tools"]
publish = true

[dependencies]
# `path` builds inside this workspace; `version` is what cargo publishes.
cortex-domain = { path = "../cortex-domain", version = "0.1.0" }
serde_json.workspace = true

[lints]
workspace = true
